<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فريق بوضوح — الأخصائيون</title>
<meta name="description" content="تعرّف على فريق المختصين النفسيين المرخّصين بمنصة بوضوح.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241D2E; --ink-soft:#372C46; --plum:#4A3B5C;
    --fog:#F3EEEA; --fog-dim:#E6DFDA;
    --clarity:#C9A15F; --clarity-soft:#E4C98A; --rose:#8B6F7E; --alert:#B5555B;
    --text-on-dark:#EDE7E3; --text-muted-dark:#B7ACC4;
    --text-on-light:#2A2130; --text-muted-light:#6B6072;
    --radius:14px; --max:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--fog); color:var(--text-on-light); line-height:1.9; -webkit-font-smoothing:antialiased; }
  h1,h2,.kufi{ font-family:'Noto Kufi Arabic', sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 24px; }

  .page-head{ background:radial-gradient(120% 90% at 75% 0%, var(--ink-soft) 0%, var(--ink) 55%, #1A1522 100%); padding:64px 0 48px; text-align:center; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--clarity-soft); font-weight:600; margin-bottom:14px; justify-content:center; }
  .eyebrow::before{ content:""; width:20px; height:1px; background:var(--clarity-soft); display:inline-block; }
  .page-head h1{ color:var(--fog); font-size:clamp(28px,4.4vw,42px); font-weight:900; }
  .page-head p{ color:var(--text-muted-dark); font-size:15.5px; max-width:52ch; margin:14px auto 0; }

  main{ padding:56px 0 90px; }
  .team-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:26px; }
  @media (max-width:900px){ .team-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:600px){ .team-grid{ grid-template-columns:1fr; } }

  .specialist-card{
    background:#fff; border:1px solid var(--fog-dim); border-radius:20px; overflow:hidden;
    transition:.2s; display:block; box-shadow:0 20px 40px -30px rgba(36,29,46,.2);
  }
  .specialist-card:hover{ transform:translateY(-4px); box-shadow:0 24px 50px -28px rgba(36,29,46,.3); }
  .specialist-photo{ width:100%; height:260px; object-fit:cover; display:block; background:var(--fog-dim); }
  .specialist-body{ padding:22px 20px; }
  .specialist-name{ font-family:'Noto Kufi Arabic',sans-serif; font-weight:700; font-size:17px; margin-bottom:4px; }
  .specialist-role{ font-size:13px; color:var(--clarity); font-weight:600; margin-bottom:10px; }
  .specialist-bio{ font-size:13.5px; color:var(--text-muted-light); }

  .empty-state{ text-align:center; padding:60px 0; color:var(--text-muted-light); }

  footer{ background:var(--ink); color:var(--text-muted-dark); padding:44px 0 28px; text-align:center; font-size:12.5px; }
  footer .brand{ display:block; margin-bottom:10px; font-size:18px; }
</style>
</head>
<body>

<site-nav></site-nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">مين رح يسمعك</div>
    <h1>فريق بوضوح</h1>
    <p>مختصون نفسيون مرخّصون، اخترناهم بعناية — تعرّفي على كل وحد فيهم قبل ما تحجزي.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="team-grid" id="teamGrid">
      <p class="empty-state">جارٍ تحميل الفريق...</p>
    </div>
  </div>
</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
async function loadTeam(){
  const grid = document.getElementById('teamGrid');
  if (typeof supabaseClient === 'undefined' || !supabaseClient) {
    grid.innerHTML = '<p class="empty-state">تعذّر تحميل الفريق حالياً.</p>';
    return;
  }

  const { data, error } = await supabaseClient
    .from('specialists')
    .select('*')
    .eq('is_published', true)
    .order('sort_order', { ascending: true });

  if (error || !data || !data.length) {
    grid.innerHTML = '<p class="empty-state">ما في أخصائيين معروضين حالياً.</p>';
    return;
  }

  grid.innerHTML = data.map(sp => `
    <a href="/specialist/?slug=${encodeURIComponent(sp.slug)}" class="specialist-card">
      <img class="specialist-photo" src="${sp.photo_url}" alt="${sp.full_name}" loading="lazy">
      <div class="specialist-body">
        <div class="specialist-name">${sp.full_name}</div>
        <div class="specialist-role">${sp.specialty}</div>
        <p class="specialist-bio">${sp.short_bio || (sp.bio.length > 90 ? sp.bio.slice(0, 90) + '…' : sp.bio)}</p>
      </div>
    </a>
  `).join('');
}
loadTeam();
</script>

<app-bottom-nav></app-bottom-nav>
<script src="/components.js"></script>
</body>
</html>
