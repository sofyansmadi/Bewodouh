<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate your session — Bewoduh</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#241D2E; --ink-soft:#372C46; --fog:#F3EEEA; --fog-dim:#E6DFDA; --clarity:#C9A15F; --clarity-soft:#E4C98A; --alert:#B5555B; --ok:#2E6B45;
    --text-on-dark:#EDE7E3; --text-muted-dark:#B7ACC4; --text-on-light:#2A2130; --text-muted-light:#6B6072; --max:640px; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--fog); color:var(--text-on-light); line-height:1.9; -webkit-font-smoothing:antialiased; }
  h1,h2,.kufi{ font-family:'Noto Kufi Arabic', sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 20px; }
  main{ padding:34px 0 90px; }
  .card{ background:#fff; border:1px solid var(--fog-dim); border-radius:20px; padding:28px 26px; box-shadow:0 24px 50px -34px rgba(36,29,46,.3); }
  .who{ display:flex; gap:16px; align-items:center; margin-bottom:22px; }
  .who img{ width:72px; height:90px; border-radius:14px; object-fit:cover; object-position:50% 20%; background:var(--fog-dim); flex:none; }
  .who h1{ font-size:19px; line-height:1.5; }
  .who p{ font-size:13px; color:var(--text-muted-light); }
  .q{ margin:26px 0 8px; font-family:'Noto Kufi Arabic',sans-serif; font-weight:700; font-size:15px; color:var(--ink); }
  .q small{ font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:400; color:var(--text-muted-light); font-size:12.5px; margin-inline-start:6px; }
  .stars{ display:flex; gap:6px; direction:ltr; justify-content:center; }
  .stars button{ background:none; border:none; font-size:44px; line-height:1; color:#D9D2DD; cursor:pointer; padding:2px 4px; transition:transform .12s, color .12s; }
  .stars button.on{ color:var(--clarity); }
  .stars button:hover{ transform:scale(1.12); }
  .stars.sm{ justify-content:flex-start; } .stars.sm button{ font-size:23px; padding:2px; }
  .asp > span{ flex:1; }
  .starlbl{ text-align:center; font-size:14px; font-weight:700; color:var(--ink); min-height:24px; margin-top:4px; }
  .asp{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--fog-dim); font-size:14px; }
  .nps{ display:grid; grid-template-columns:repeat(11, 1fr); gap:5px; direction:ltr; }
  .nps button{ border:1.5px solid var(--fog-dim); background:var(--fog); border-radius:10px; padding:9px 0; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; color:var(--ink); }
  .nps button.on{ background:var(--ink); color:var(--fog); border-color:var(--ink); }
  .nps-l{ display:flex; justify-content:space-between; direction:ltr; font-size:11.5px; color:var(--text-muted-light); margin-top:4px; }
  textarea{ width:100%; border:1.5px solid var(--fog-dim); border-radius:14px; padding:13px 15px; font-family:inherit; font-size:15px; background:var(--fog); min-height:104px; resize:vertical; }
  textarea:focus{ outline:none; border-color:var(--clarity); background:#fff; }
  label.chk{ display:flex; gap:10px; align-items:flex-start; font-size:14px; margin:9px 0; cursor:pointer; }
  label.chk input{ width:18px; height:18px; margin-top:4px; flex:none; accent-color:var(--ink); }
  .flags{ background:#FBF6EC; border:1px solid #EBD9B5; border-radius:14px; padding:12px 16px; }
  .btn{ width:100%; margin-top:26px; background:var(--ink); color:var(--fog); border:none; border-radius:100px; padding:15px 24px; font-family:inherit; font-weight:700; font-size:16px; cursor:pointer; }
  .btn:disabled{ opacity:.55; cursor:default; }
  .err{ color:var(--alert); font-size:13.5px; margin-top:10px; min-height:20px; text-align:center; }
  .center{ text-align:center; }
  .big{ font-size:44px; margin-bottom:6px; }
  .privacy{ font-size:12.5px; color:var(--text-muted-light); margin-top:14px; line-height:1.8; }
  .hide{ display:none; }
</style>
</head>
<body>
<site-nav></site-nav>
<main>
  <div class="wrap">
    <div class="card" id="box"><p class="center" style="color:var(--text-muted-light);" id="loading"></p></div>
  </div>
</main>
<app-bottom-nav></app-bottom-nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
(function () {
const EN = document.documentElement.lang === 'en';
const t = (ar, en) => EN ? en : ar;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const box = document.getElementById('box');
document.title = t('قيّم جلستك — بوضوح', 'Rate your session — Bewoduh');
document.getElementById('loading').textContent = t('جارٍ التحميل...', 'Loading...');
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const LABEL = ['', t('سيئة', 'Poor'), t('مقبولة', 'Fair'), t('جيدة', 'Good'), t('جيدة جداً', 'Very good'), t('ممتازة', 'Excellent')];
const msg = (icon, title, text) => { box.innerHTML = `<div class="center"><div class="big">${icon}</div><h1 class="kufi" style="font-size:20px;margin-bottom:8px;">${esc(title)}</h1><p style="color:var(--text-muted-light);">${esc(text)}</p><p style="margin-top:20px;"><a href="${EN ? '/en/' : '/'}" style="color:var(--clarity);font-weight:700;text-decoration:underline;">${t('العودة للرئيسية', 'Back to home')}</a></p></div>`; };

function starRow(cls, onPick) {
  const d = document.createElement('div'); d.className = 'stars ' + cls; d.setAttribute('role', 'radiogroup');
  let v = 0;
  for (let i = 1; i <= 5; i++) { const b = document.createElement('button'); b.type = 'button'; b.textContent = '★'; b.setAttribute('role', 'radio'); b.setAttribute('aria-label', i + ' / 5'); b.addEventListener('click', () => { v = i; paint(); onPick && onPick(i); }); d.appendChild(b); }
  const paint = () => d.querySelectorAll('button').forEach((b, k) => { b.classList.toggle('on', k < v); b.setAttribute('aria-checked', String(k + 1 === v)); });
  d.get = () => v; return d;
}

async function init() {
  if (!supabaseClient || !/^[0-9a-f-]{36}$/i.test(TOKEN)) return msg('🔗', t('الرابط غير صالح', 'Invalid link'), t('تأكد من فتح الرابط كاملاً من الرسالة التي وصلتك.', 'Please open the full link from the email we sent you.'));
  const { data, error } = await supabaseClient.rpc('feedback_info', { p_token: TOKEN });
  if (error || !data || !data.ok) return msg('🔗', t('الرابط غير صالح', 'Invalid link'), t('لم نجد هذا الطلب. تأكد من الرابط.', 'We could not find this request. Please check the link.'));
  if (data.submitted) return msg('💛', t('شكراً لك', 'Thank you'), t('سبق أن أرسلت تقييمك لهذه الجلسة. نقدّر وقتك.', 'You already sent your feedback for this session. We appreciate your time.'));
  const name = (EN ? data.specialist_name_en : '') || data.specialist_name || '';
  const when = data.session_at ? new Date(data.session_at).toLocaleDateString(EN ? 'en-GB' : 'ar-JO-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  box.innerHTML = `<div class="who">${data.photo_url ? `<img src="${esc(data.photo_url)}" alt="">` : ''}<div><h1>${esc(t('كيف كانت جلستك مع ', 'How was your session with ') + name + (EN ? '?' : '؟'))}</h1><p>${esc(when)}${data.total > 1 ? ' · ' + t('الجلسة ' + data.seq + ' من ' + data.total, 'Session ' + data.seq + ' of ' + data.total) : ''}</p></div></div>
    <div class="q">${t('تقييمك العام', 'Your overall rating')} *</div><div id="mainStars"></div><div class="starlbl" id="starLbl"></div>
    <div class="q">${t('قيّم جوانب الجلسة', 'Rate the details')}<small>${t('(اختياري)', '(optional)')}</small></div><div id="aspects"></div>
    <div class="q">${t('ما احتمال أن تنصح صديقاً بهذا الأخصائي؟', 'How likely are you to recommend this specialist to a friend?')}<small>${t('(اختياري)', '(optional)')}</small></div>
    <div class="nps" id="nps">${Array.from({ length: 11 }, (_, i) => `<button type="button" data-v="${i}">${i}</button>`).join('')}</div><div class="nps-l"><span>${t('غير محتمل أبداً', 'Not at all likely')}</span><span>${t('محتمل جداً', 'Extremely likely')}</span></div>
    <div class="q">${t('تعليقك', 'Your comment')}<small>${t('(اختياري)', '(optional)')}</small></div>
    <textarea id="comment" maxlength="1500" placeholder="${t('ما الذي أفادك؟ وما الذي كان يمكن أن يكون أفضل؟', 'What helped you? What could have been better?')}"></textarea>
    <label class="chk"><input type="checkbox" id="pub"><span>${t('أسمح بنشر تعليقي في صفحة الأخصائي باسمي الأول فقط (بعد مراجعة فريق بوضوح).', 'I allow my comment to be shown on the specialist\'s page with my first name only (after review by the Bewoduh team).')}</span></label>
    <div class="q">${t('هل حدث شيء من التالي؟', 'Did any of the following happen?')}<small>${t('(يصل لفريق بوضوح فقط)', '(seen only by the Bewoduh team)')}</small></div>
    <div class="flags">
      <label class="chk"><input type="checkbox" value="late_or_absent"><span>${t('تأخّر الأخصائي كثيراً أو لم يحضر', 'The specialist was very late or did not show up')}</span></label>
      <label class="chk"><input type="checkbox" value="off_platform"><span>${t('طُلب مني التواصل أو الدفع خارج منصة بوضوح', 'I was asked to communicate or pay outside the Bewoduh platform')}</span></label>
      <label class="chk"><input type="checkbox" value="uncomfortable"><span>${t('شعرت بعدم الارتياح أو بعدم الاحترام', 'I felt uncomfortable or disrespected')}</span></label>
      <label class="chk"><input type="checkbox" value="technical"><span>${t('واجهتني مشكلة تقنية في الجلسة', 'I had a technical problem during the session')}</span></label>
    </div>
    <div class="q">${t('ملاحظة خاصة لفريق بوضوح', 'A private note to the Bewoduh team')}<small>${t('(اختياري، لا تُنشر ولا يراها الأخصائي)', '(optional, never published and not shown to the specialist)')}</small></div>
    <textarea id="note" maxlength="1500" style="min-height:80px;"></textarea>
    <button class="btn" id="send" type="button">${t('إرسال التقييم', 'Send my feedback')}</button><div class="err" id="err" role="alert"></div>
    <p class="privacy">${t('تقييمك بالنجوم يدخل في متوسط تقييم الأخصائي. لا يرى الأخصائي ملاحظاتك الخاصة ولا ما حدّدته أعلاه.', 'Your star rating counts towards the specialist\'s average. The specialist never sees your private note or the items you ticked above.')}</p>`;
  let main = 0, rec = null; const asp = {};
  const ms = starRow('', (v) => { main = v; document.getElementById('starLbl').textContent = LABEL[v]; }); document.getElementById('mainStars').appendChild(ms);
  [['listening', t('الإصغاء والفهم', 'Listening and understanding')], ['clarity', t('وضوح النصائح والتوجيه', 'Clarity of advice')], ['punctuality', t('الالتزام بالموعد', 'Punctuality')]].forEach(([k, l]) => {
    const row = document.createElement('div'); row.className = 'asp'; row.innerHTML = `<span>${esc(l)}</span>`; const sr = starRow('sm', (v) => { asp[k] = v; }); row.appendChild(sr); document.getElementById('aspects').appendChild(row);
  });
  document.querySelectorAll('#nps button').forEach(b => b.addEventListener('click', () => { rec = +b.dataset.v; document.querySelectorAll('#nps button').forEach(x => x.classList.toggle('on', x === b)); }));
  document.getElementById('send').addEventListener('click', async () => {
    const err = document.getElementById('err'); err.textContent = '';
    if (!main) { err.textContent = t('اختر تقييمك العام بالنجوم أولاً.', 'Please choose your overall star rating first.'); return; }
    const btn = document.getElementById('send'); btn.disabled = true;
    const flags = [...document.querySelectorAll('.flags input:checked')].map(i => i.value);
    const { error } = await supabaseClient.rpc('submit_feedback', { p_token: TOKEN, p_rating: main, p_recommend: rec, p_aspects: asp, p_comment: document.getElementById('comment').value, p_public_ok: document.getElementById('pub').checked, p_flags: flags, p_team_note: document.getElementById('note').value });
    if (error) {
      btn.disabled = false;
      if (/already_submitted/.test(error.message || '')) return msg('💛', t('شكراً لك', 'Thank you'), t('سبق أن أرسلت تقييمك لهذه الجلسة.', 'You already sent your feedback for this session.'));
      err.textContent = t('تعذّر الإرسال. حاول مرة أخرى.', 'Could not send. Please try again.'); console.error(error); return;
    }
    msg('💛', t('شكراً لك على رأيك', 'Thank you for your feedback'), t('رأيك يساعدنا نتحسّن ويساعد غيرك على اختيار الأخصائي المناسب.', 'Your opinion helps us improve and helps others choose the right specialist.'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}
init();
})();
</script>
<script src="/components.js"></script>
</body>
</html>
