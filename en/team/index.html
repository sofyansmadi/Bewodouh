<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Team — Specialists | Bewoduh</title>
<meta name="description" content="Meet the team of licensed mental health professionals on the Bewoduh platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241D2E; --ink-soft:#372C46; --plum:#4A3B5C;
    --fog:#F3EEEA; --fog-dim:#E6DFDA;
    --clarity:#C9A15F; --clarity-soft:#E4C98A; --rose:#8B6F7E; --alert:#B5555B;
    --text-on-dark:#EDE7E3; --text-muted-dark:#B7ACC4;
    --text-on-light:#2A2130; --text-muted-light:#6B6072;
    --radius:14px; --max:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--fog); color:var(--text-on-light); line-height:1.9; -webkit-font-smoothing:antialiased; }
  h1,h2,.kufi{ font-family:'Noto Kufi Arabic', sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 24px; }

  .page-head{ background:radial-gradient(120% 90% at 25% 0%, var(--ink-soft) 0%, var(--ink) 55%, #1A1522 100%); padding:64px 0 48px; text-align:center; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--clarity-soft); font-weight:600; margin-bottom:14px; justify-content:center; }
  .eyebrow::before{ content:""; width:20px; height:1px; background:var(--clarity-soft); display:inline-block; }
  .page-head h1{ color:var(--fog); font-size:clamp(28px,4.4vw,42px); font-weight:900; }
  .page-head p{ color:var(--text-muted-dark); font-size:15.5px; max-width:52ch; margin:14px auto 0; }

  main{ padding:56px 0 90px; }
  .team-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:26px; }
  @media (max-width:900px){ .team-grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:600px){ .team-grid{ grid-template-columns:repeat(2, 1fr); gap:12px; } }

  .specialist-card{
    background:#fff; border:1px solid var(--fog-dim); border-radius:20px; overflow:hidden;
    transition:.2s; display:block; box-shadow:0 20px 40px -30px rgba(36,29,46,.2);
  }
  .specialist-card:hover{ transform:translateY(-4px); box-shadow:0 24px 50px -28px rgba(36,29,46,.3); }
  .specialist-photo{ width:100%; aspect-ratio:4/5; height:auto; object-fit:cover; object-position:center 22%; display:block; background:var(--fog-dim); }
  .specialist-body{ padding:22px 20px; }
  .specialist-name{ font-family:'Noto Kufi Arabic',sans-serif; font-weight:700; font-size:17px; margin-bottom:4px; }
  .specialist-role{ font-size:13px; color:var(--clarity); font-weight:600; margin-bottom:10px; }
  .specialist-bio{ font-size:13.5px; color:var(--text-muted-light); }
  .specialist-name, .specialist-role, .specialist-bio{ display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
  .specialist-name{ -webkit-line-clamp:2; }
  .specialist-role{ -webkit-line-clamp:2; }
  .specialist-bio{ -webkit-line-clamp:3; }
  @media (max-width:600px){
    .specialist-card{ border-radius:14px; }
    .specialist-body{ padding:12px 12px 14px; }
    .specialist-name{ font-size:14px; line-height:1.5; }
    .specialist-role{ font-size:11.5px; line-height:1.6; margin-bottom:6px; }
    .specialist-bio{ font-size:12px; line-height:1.7; -webkit-line-clamp:2; }
  }

  .empty-state{ text-align:center; padding:60px 0; color:var(--text-muted-light); }
</style>
<!-- seo:start -->
<link rel="canonical" href="https://bewoduh.com/en/team/">
<link rel="alternate" hreflang="ar" href="https://bewoduh.com/team/">
<link rel="alternate" hreflang="en" href="https://bewoduh.com/en/team/">
<link rel="alternate" hreflang="x-default" href="https://bewoduh.com/team/">
<meta property="og:site_name" content="Bewoduh">
<meta property="og:type" content="website">
<meta property="og:title" content="Our Team — Specialists | Bewoduh">
<meta property="og:description" content="Meet the team of licensed mental health professionals on the Bewoduh platform.">
<meta property="og:url" content="https://bewoduh.com/en/team/">
<meta property="og:image" content="https://bewoduh.com/images/og-cover.jpg">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<!-- seo:end -->
</head>
<body>

<site-nav active="team"></site-nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">Who Will Listen to You</div>
    <h1>Our Team</h1>
    <p>Licensed mental health professionals, carefully selected — get to know each one before you book.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="teamFilters"></div>
    <div class="team-grid" id="teamGrid">
      <p class="empty-state">Loading the team...</p>
    </div>
  </div>
</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/team-ui.js?v=1"></script>
<script>BW.teamPage(document.getElementById('teamGrid'), document.getElementById('teamFilters'));</script>

<app-bottom-nav></app-bottom-nav>
<script src="/components.js"></script>
</body>
</html>
