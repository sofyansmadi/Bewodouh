<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specialists' Portal — Bewoduh</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241D2E; --ink-soft:#372C46; --fog:#F3EEEA; --fog-dim:#E6DFDA;
    --clarity:#C9A15F; --clarity-soft:#E4C98A; --alert:#B5555B; --ok:#2E6B45;
    --text-on-dark:#EDE7E3; --text-muted-dark:#B7ACC4; --text-on-light:#2A2130; --text-muted-light:#6B6072;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans Arabic','Inter',sans-serif; background:var(--fog); color:var(--text-on-light); line-height:1.8; -webkit-font-smoothing:antialiased; }
  html[lang="en"] body{ font-family:'Inter','IBM Plex Sans Arabic',sans-serif; line-height:1.65; }
  h1,h2,h3,.kufi{ font-family:'Noto Kufi Arabic',sans-serif; }
  html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, html[lang="en"] .kufi, html[lang="en"] .field label, html[lang="en"] .lbl, html[lang="en"] .tab, html[lang="en"] th, html[lang="en"] .brand, html[lang="en"] .stat b, html[lang="en"] .daygrp h4{ font-family:'Inter',sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1040px; margin:0 auto; padding:0 20px; }
  header{ background:var(--ink); padding:16px 0; position:sticky; top:0; z-index:20; }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ font-family:'Noto Kufi Arabic',sans-serif; font-weight:900; font-size:20px; color:var(--fog); }
  .brand span{ color:var(--clarity); }
  .brand small{ font-weight:500; font-size:12.5px; color:var(--text-muted-dark); margin-inline-start:10px; }
  .hdr-actions{ display:flex; gap:8px; align-items:center; }
  .ghost-btn{ background:none; border:1px solid rgba(255,255,255,.25); color:var(--text-muted-dark); font-size:13px; padding:8px 16px; border-radius:100px; cursor:pointer; font-family:inherit; }
  .ghost-btn:hover{ color:var(--fog); border-color:var(--clarity); }
  main{ padding:30px 0 90px; }
  .hidden{ display:none !important; }

  .card{ background:#fff; border:1px solid var(--fog-dim); border-radius:16px; padding:24px; box-shadow:0 12px 30px -24px rgba(36,29,46,.25); }
  .login{ max-width:420px; margin:60px auto; }
  .login h1{ font-size:22px; margin-bottom:6px; } .login p{ color:var(--text-muted-light); font-size:14px; margin-bottom:20px; }
  .field{ margin-bottom:16px; }
  .field label, .lbl{ display:block; font-family:'Noto Kufi Arabic',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:6px; }
  .field input, .field select, .field textarea, .inp{ width:100%; border:1.5px solid var(--fog-dim); border-radius:12px; padding:11px 14px; font-family:inherit; font-size:14.5px; background:var(--fog); color:var(--text-on-light); }
  .field textarea{ min-height:110px; resize:vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .inp:focus{ outline:none; border-color:var(--clarity); background:#fff; }
  .field input:disabled, .inp:disabled{ opacity:.7; }
  .ltr{ direction:ltr; text-align:left; }
  .btn{ background:var(--ink); color:var(--fog); font-weight:700; font-size:14.5px; padding:12px 24px; border-radius:100px; border:none; cursor:pointer; font-family:inherit; }
  .btn:hover{ background:var(--ink-soft); } .btn:disabled{ opacity:.55; cursor:not-allowed; }
  .btn.full{ width:100%; }
  .btn2{ background:var(--fog); color:var(--ink); font-weight:700; font-size:13.5px; padding:9px 18px; border-radius:100px; border:1px solid var(--fog-dim); cursor:pointer; font-family:inherit; }
  .btn2:hover{ border-color:var(--clarity); } .btn2.danger{ color:var(--alert); }
  .msg{ font-size:13px; margin-top:10px; min-height:18px; } .msg.err{ color:var(--alert); } .msg.ok{ color:var(--ok); }

  .tabs{ display:flex; gap:6px; overflow-x:auto; border-bottom:1px solid var(--fog-dim); margin-bottom:26px; padding-bottom:1px; }
  .tab{ background:none; border:none; padding:12px 14px; font-family:'Noto Kufi Arabic',sans-serif; font-weight:700; font-size:14px; color:var(--text-muted-light); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--clarity); }
  .tab .count{ background:var(--clarity-soft); color:var(--ink); font-size:11px; padding:1px 8px; border-radius:100px; margin-inline-start:6px; }
  h2.title{ font-size:20px; margin-bottom:4px; } .sub{ font-size:13.5px; color:var(--text-muted-light); margin-bottom:20px; }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:24px; }
  .stat{ background:#fff; border:1px solid var(--fog-dim); border-radius:14px; padding:18px; }
  .stat b{ display:block; font-family:'Noto Kufi Arabic',sans-serif; font-size:28px; color:var(--ink); line-height:1.2; }
  .stat span{ font-size:12.5px; color:var(--text-muted-light); }
  .bars{ display:flex; align-items:flex-end; gap:14px; height:150px; padding-top:10px; }
  .bar{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; font-size:12px; color:var(--text-muted-light); }
  .bar i{ display:block; width:100%; max-width:46px; background:var(--clarity); border-radius:8px 8px 0 0; min-height:3px; }
  .bar em{ font-style:normal; font-weight:700; color:var(--ink); }

  .tbl-wrap{ overflow-x:auto; background:#fff; border-radius:16px; box-shadow:0 12px 30px -20px rgba(36,29,46,.2); }
  table{ width:100%; border-collapse:collapse; min-width:640px; }
  th,td{ padding:13px 14px; text-align:start; font-size:13.5px; border-bottom:1px solid var(--fog-dim); vertical-align:top; }
  th{ background:var(--ink); color:var(--fog); font-family:'Noto Kufi Arabic',sans-serif; font-size:12.5px; }
  tr:last-child td{ border-bottom:none; }
  .muted{ color:var(--text-muted-light); font-size:12.5px; }
  .badge{ display:inline-block; font-size:11.5px; font-weight:700; padding:2px 10px; border-radius:100px; background:rgba(201,161,95,.18); color:#7D5F27; }
  .badge.ok{ background:rgba(60,140,90,.14); color:var(--ok); } .badge.bad{ background:rgba(181,85,93,.14); color:#9C3F47; } .badge.grey{ background:rgba(120,110,130,.14); color:var(--text-muted-light); }
  .empty{ text-align:center; color:var(--text-muted-light); padding:34px 10px; background:#fff; border-radius:16px; border:1px dashed var(--fog-dim); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:640px){ .grid2{ grid-template-columns:1fr; } }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .days{ display:flex; gap:8px; flex-wrap:wrap; } .days label{ display:flex; align-items:center; gap:5px; background:var(--fog); border:1.5px solid var(--fog-dim); border-radius:100px; padding:6px 12px; font-size:13px; cursor:pointer; margin:0; font-family:inherit; font-weight:500; }
  .days input{ width:auto; }
  .daygrp{ margin-bottom:16px; } .daygrp h4{ font-family:'Noto Kufi Arabic',sans-serif; font-size:14px; margin-bottom:8px; }
  .slot{ display:inline-flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--fog-dim); border-radius:100px; padding-block:6px; padding-inline:14px 8px; margin-inline-end:8px; margin-bottom:8px; font-size:13px; }
  .slot.booked{ background:rgba(201,161,95,.15); border-color:var(--clarity); padding-inline:14px; }
  .slot button{ background:none; border:none; color:var(--alert); font-size:15px; cursor:pointer; line-height:1; }
  .note{ background:var(--fog); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:13.5px; white-space:pre-wrap; }
  .note .meta{ display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--text-muted-light); margin-bottom:6px; }
  .privacy{ background:rgba(201,161,95,.12); border:1px solid rgba(201,161,95,.4); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:18px; }
  .avatar{ width:96px; height:96px; border-radius:50%; object-fit:cover; background:var(--fog-dim); border:1px solid var(--fog-dim); }
  a.lnk{ color:#7D5F27; text-decoration:underline; font-weight:600; }
  .section-gap{ margin-top:22px; }
  .cbox{ background:#fff; border:1px solid var(--fog-dim); border-radius:18px; display:flex; flex-direction:column; height:min(74vh, 660px); min-height:420px; overflow:hidden; }
  .chead{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--fog-dim); }
  .cbar{ background:var(--fog); font-size:12.5px; padding:7px 16px; color:var(--text-muted-light); display:flex; gap:14px; flex-wrap:wrap; border-bottom:1px solid var(--fog-dim); }
  .cmsgs{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#FBF9F7; }
  .cm{ max-width:82%; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
  .cm.me{ align-self:flex-start; background:var(--ink); color:var(--fog); }
  .cm.them{ align-self:flex-end; background:#fff; border:1px solid var(--fog-dim); }
  .cm.sys{ align-self:center; max-width:92%; text-align:center; background:transparent; font-size:12.5px; color:var(--text-muted-light); padding:2px 8px; }
  .cm time{ display:block; font-size:10.5px; opacity:.6; margin-top:2px; }
  .cban{ padding:10px 16px; font-size:13.5px; border-top:1px solid var(--fog-dim); display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:#EEEAF6; color:var(--plum); }
  .cban.warn{ background:#FDF8EE; color:#7D5F27; }
  .cform{ display:flex; gap:10px; padding:12px; border-top:1px solid var(--fog-dim); align-items:flex-end; }
  .cform textarea{ flex:1; border:1.5px solid var(--fog-dim); border-radius:14px; padding:10px 14px; font-family:inherit; font-size:14.5px; resize:none; max-height:120px; background:var(--fog); min-height:44px; }
  .cform textarea:focus{ outline:none; border-color:var(--clarity); background:#fff; }
  .reqcard{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:#FDF8EE; border:1.5px solid #EBD9B5; border-radius:14px; padding:14px 18px; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <div class="hdr-actions">
      <a class="ghost-btn" id="langLink" href="#"></a>
      <button class="ghost-btn hidden" id="logoutBtn" type="button"></button>
    </div>
  </div>
</header>
<main class="wrap">
  <section id="loginView" class="login card hidden"></section>
  <section id="unlinkedView" class="login card hidden"></section>
  <section id="portalView" class="hidden">
    <div style="margin-bottom:18px;"><h1 class="kufi" style="font-size:22px;" id="hello"></h1><div class="muted" id="helloSub"></div></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="tab-overview"></div><div id="tab-upcoming" class="hidden"></div><div id="tab-schedule" class="hidden"></div><div id="tab-chat" class="hidden"></div>
    <div id="tab-past" class="hidden"></div><div id="tab-cancelled" class="hidden"></div><div id="tab-clients" class="hidden"></div><div id="tab-profile" class="hidden"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/password-reset.js"></script>
<script>
/* بوابة الأخصائيين / Specialists' portal. عربي وإنجليزي من نفس الملف: اللغة من وسم html lang.
   كل الصلاحيات مفروضة من قاعدة البيانات (RLS): الأخصائي يرى حجوزاته المدفوعة والملغاة فقط، ويعدّل جدوله وملفه وملاحظاته فقط.
   هذه الصفحة واجهة فقط ولا تمنح أي صلاحية. */
const EN = document.documentElement.lang === 'en';
const t = (ar, en) => EN ? en : ar;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const sb = supabaseClient;
const LOC = EN ? 'en-GB' : 'ar-JO-u-nu-latn';
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return ''; } })();
const fmtDT = (iso) => new Date(iso).toLocaleString(LOC, { dateStyle: 'medium', timeStyle: 'short' });
const fmtD = (iso) => new Date(iso).toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtT = (iso) => new Date(iso).toLocaleTimeString(LOC, { hour: '2-digit', minute: '2-digit' });
const FEE_FIRST = 10, FEE_NEXT = 15; // أتعاب الأخصائي حسب العقد: ١٠$ أول جلسة مع كل عميل، ١٥$ لكل جلسة لاحقة
const PKG_EN = { 'استشارة سريعة': 'Quick Consultation', 'باقة الانطلاقة': 'Launch Package', 'باقة المرافقة': 'Companion Package', 'دعم فوري': 'Immediate Support', 'ادعم بوضوح': 'Support Bewoduh' };
const pkg = (n) => EN ? (PKG_EN[n] || n) : n;

let ME = null, BOOKINGS = [], SLOTS = [], PROFILE = null, currentClient = null, AUTH_EMAIL = '';

/* ---------- static chrome ---------- */
document.title = t('بوابة الأخصائيين — بوضوح', "Specialists' Portal — Bewoduh");
$('brand').innerHTML = t('بوضوح<span>.</span><small>بوابة الأخصائيين</small>', 'Bewoduh<span>.</span><small>Specialists\' portal</small>');
$('logoutBtn').textContent = t('تسجيل الخروج', 'Sign out');
$('langLink').textContent = t('English', 'العربية');
const setLangLink = () => { $('langLink').href = (EN ? '/specialist-portal/' : '/en/specialist-portal/') + location.hash; };
setLangLink(); window.addEventListener('hashchange', setLangLink);
$('loginView').innerHTML = `
  <h1>${t('دخول الأخصائيين', 'Specialists sign in')}</h1>
  <p>${t('ادخل بالبريد الإلكتروني الذي سجّلت به طلب الانضمام إلى فريق بوضوح.', 'Sign in with the email you used for your application to the Bewoduh team.')}</p>
  <form id="loginForm">
    <div class="field"><label for="lgEmail">${t('البريد الإلكتروني', 'Email')}</label><input type="email" id="lgEmail" required autocomplete="email" class="ltr"></div>
    <div class="field"><label for="lgPass">${t('كلمة السر', 'Password')}</label><input type="password" id="lgPass" required autocomplete="current-password" class="ltr"></div>
    <p style="margin:-4px 0 14px; font-size:13px;"><a href="#" id="forgotLink" class="lnk">${t('نسيت كلمة السر؟', 'Forgot your password?')}</a></p>
    <button class="btn full" type="submit">${t('دخول', 'Sign in')}</button>
    <div class="msg" id="loginMsg"></div>
  </form>
  <p style="margin-top:18px; font-size:13px;">${t('أول مرة؟ وصلتك دعوة بالبريد؟ ', 'First time? ')}<a class="lnk" href="${EN ? '/en/signup/' : '/signup/'}?next=portal">${t('أنشئ حسابك بنفس البريد', 'Create your account with the same email')}</a>${t(' وأكّد بريدك بالرمز، وبعدها تنتقل إلى هنا تلقائياً. لا يظهر لك شيء قبل أن تربط الإدارة حسابك بملفك في الفريق.', ', confirm it with the code, and you will land here automatically. Nothing is shown until the team links your account to your profile.')}</p>`;
$('unlinkedView').innerHTML = `
  <h1>${t('حسابك غير مرتبط بملف أخصائي', 'Your account is not linked to a specialist profile')}</h1>
  <p>${t('سجّلت الدخول، لكن هذا البريد غير مرتبط بأي ملف في فريق بوضوح. تأكد أنك دخلت بنفس البريد الذي قدّمت به طلب الانضمام، أو تواصل مع الإدارة على hello@bewoduh.com.', 'You are signed in, but this email is not linked to any profile in the Bewoduh team. Make sure you signed in with the email you used for your application, or contact us at hello@bewoduh.com.')}</p>
  <button class="btn full" id="unlinkedLogout" type="button">${t('تسجيل الخروج', 'Sign out')}</button>`;
const TABS = [['overview', t('نظرة عامة', 'Overview')], ['upcoming', t('القادمة', 'Upcoming')], ['schedule', t('جدولي المتاح', 'My availability')], ['chat', t('المحادثات', 'Chats')], ['past', t('الجلسات السابقة', 'Past sessions')], ['cancelled', t('الملغاة', 'Cancelled')], ['clients', t('ملفات المراجعين', 'Client files')], ['profile', t('ملفي وبياناتي', 'My profile & details')]];
$('tabs').innerHTML = TABS.map(([k, l], i) => `<button class="tab${i ? '' : ' active'}" data-tab="${k}">${l}${k === 'upcoming' ? ' <span class="count" id="cUpcoming">0</span>' : ''}${k === 'chat' ? ' <span class="count hidden" id="cChat">0</span>' : ''}</button>`).join('');

/* ---------- auth ---------- */
function show(view){ ['loginView','unlinkedView','portalView'].forEach(v => $(v).classList.toggle('hidden', v !== view)); $('logoutBtn').classList.toggle('hidden', view === 'loginView'); }
async function logout(){ await sb.auth.signOut(); ME = null; show('loginView'); }
$('logoutBtn').addEventListener('click', logout);
$('unlinkedLogout').addEventListener('click', logout);
$('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  openPasswordReset({ lang: EN ? 'en' : 'ar', email: $('lgEmail').value, onDone: (em) => { $('lgEmail').value = em; $('lgPass').focus(); } });
});
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('loginMsg'); msg.className = 'msg'; msg.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('lgEmail').value.trim(), password: $('lgPass').value });
  if (error) { msg.className = 'msg err'; msg.textContent = t('البريد أو كلمة السر غير صحيحة، أو لم يتم تأكيد البريد.', 'Wrong email or password, or the email has not been confirmed.'); return; }
  start();
});

async function start(){
  if (!sb) { show('loginView'); return; }
  const { data: sess } = await sb.auth.getSession();
  if (!sess.session) { show('loginView'); return; }
  AUTH_EMAIL = sess.session.user.email || '';
  const { data: access, error } = await sb.rpc('my_specialist_access');
  if (error || !access) { show('unlinkedView'); return; }
  ME = access;
  setHello();
  show('portalView');
  await loadAll();
  chatInit();
  openTab(location.hash.slice(1) || 'overview');
}
function setHello(){
  $('hello').textContent = t('مرحباً ', 'Welcome, ') + ME.full_name;
  $('helloSub').textContent = t('الأوقات تظهر بتوقيت جهازك', 'Times are shown in your device time zone') + (TZ ? ' (' + TZ + ')' : '') + '.';
}

/* ---------- data ---------- */
async function loadAll(){
  const [b, s, p] = await Promise.all([
    sb.from('bookings').select('*').eq('specialist_id', ME.id).order('preferred_datetime', { ascending: false }).limit(1000),
    sb.from('availability_slots').select('*').eq('specialist_id', ME.id).gte('starts_at', new Date(Date.now() - 3600e3).toISOString()).order('starts_at', { ascending: true }).limit(500),
    sb.from('specialists').select('*').eq('id', ME.id).maybeSingle(),
  ]);
  BOOKINGS = b.data || []; SLOTS = s.data || []; PROFILE = p.data || null;
  if (b.error) console.error('bookings:', b.error);
}
const now = () => Date.now();
const isCancelled = (b) => b.status === 'ملغى';
const upcoming = () => BOOKINGS.filter(b => b.paid && !isCancelled(b) && new Date(b.preferred_datetime) > now()).sort((a, c) => new Date(a.preferred_datetime) - new Date(c.preferred_datetime));
const past = () => BOOKINGS.filter(b => b.paid && !isCancelled(b) && new Date(b.preferred_datetime) <= now());
const cancelled = () => BOOKINGS.filter(isCancelled);
const counted = () => past().filter(b => b.outcome === 'completed' || b.outcome === 'client_no_show').sort((a, c) => new Date(a.preferred_datetime) - new Date(c.preferred_datetime));

/* ---------- chat (paid live chat with clients) ---------- */
const CFG = { point_usd: 0.05, specialist_share: 0.6 };
const BASE_TITLE = document.title;
let CH = { threads: [], sess: {}, reqs: [], cur: null, msgs: [], lastId: 0, earn: { usd: 0, usdMonth: 0, min: 0 }, inited: false };
const SYSM = {
  'sys:requested': t('طلب محادثة جديد', 'New chat request'), 'sys:started': t('بدأت المحادثة (تُحتسب أتعابك كل دقيقة)', 'Chat started (you earn per minute)'),
  'sys:paused_idle': t('توقفت لعدم النشاط', 'Paused: inactivity'), 'sys:paused_no_points': t('توقفت: نقاط المراجع انتهت', 'Paused: client is out of points'),
  'sys:resumed': t('تابع المراجع المحادثة', 'The client resumed the chat'), 'sys:ended': t('انتهت المحادثة', 'Chat ended'),

async function chatRefresh(){
  const [th, ss, ea, pr] = await Promise.all([
    sb.from('chat_threads').select('*').eq('specialist_id', ME.id).order('last_message_at', { ascending: false, nullsFirst: false }),
    sb.from('chat_sessions').select('*').eq('specialist_id', ME.id).order('created_at', { ascending: false }).limit(400),
    sb.from('chat_earnings').select('usd,created_at').eq('specialist_id', ME.id).limit(10000),
    sb.from('specialists').select('*').eq('id', ME.id).maybeSingle(),
  ]);
  if (pr.data) PROFILE = pr.data;
  CH.threads = th.data || [];
  CH.sess = {}; (ss.data || []).forEach(s => { if (!CH.sess[s.thread_id]) CH.sess[s.thread_id] = s; });
  CH.reqs = (ss.data || []).filter(s => s.state === 'requested');
  const ym = (d) => d.getFullYear() + '-' + d.getMonth(); const nowYm = ym(new Date());
  CH.earn = { usd: 0, usdMonth: 0, min: (ea.data || []).length };

  const n = CH.reqs.length, el = $('cChat');

}
const chatTabVisible = () => !$('tab-chat').classList.contains('hidden');
async function chatInit(){

  await chatRefresh();
  // نبضة حضور: ما دام الأخصائي «متاح» والصفحة مفتوحة، وإلا يصبح غير متصل تلقائياً بعد دقيقتين
  setInterval(() => { if (PROFILE && PROFILE.chat_online) sb.from('specialists').update({ chat_seen_at: new Date().toISOString() }).eq('id', ME.id).then(() => {}); }, 30000);
  setInterval(async () => {
    await chatRefresh();

  sb.channel('sp-chat-' + ME.id).on('postgres_changes', { event: '*', schema: 'public', table: 'chat_sessions', filter: `specialist_id=eq.${ME.id}` }, async () => {
    await chatRefresh();

}

async function openThreadView(id){
  const th = CH.threads.find(x => x.id === id) || (await sb.from('chat_threads').select('*').eq('id', id).maybeSingle()).data;
  if (!th) return;
  if (!CH.threads.find(x => x.id === id)) CH.threads.unshift(th);
  CH.cur = { thread: th, session: CH.sess[id] || null }; CH.msgs = []; CH.lastId = 0;
  const { data } = await sb.from('chat_messages').select('*').eq('thread_id', id).order('id', { ascending: true }).limit(500);
  (data || []).forEach(m => { CH.msgs.push(m); CH.lastId = Math.max(CH.lastId, m.id); });
  openTab('chat');
}

function renderThreadParts(){

  if (atBottom || CH.msgs.length < 3) box.scrollTop = box.scrollHeight;

async function pollThread(){
  const c = CH.cur; if (!c) return;
  const [m, s] = await Promise.all([
    sb.from('chat_messages').select('*').eq('thread_id', c.thread.id).gt('id', CH.lastId).order('id', { ascending: true }),
    sb.from('chat_sessions').select('*').eq('thread_id', c.thread.id).order('created_at', { ascending: false }).limit(1),
  ]);
  (m.data || []).forEach(x => { if (!CH.msgs.some(y => y.id === x.id)) { CH.msgs.push(x); CH.lastId = Math.max(CH.lastId, x.id); } });
  if (s.data && s.data[0]) { c.session = s.data[0]; CH.sess[c.thread.id] = s.data[0]; }
  renderThreadParts();
}

// يحوّل (يوم/أيام + من وقت إلى وقت + مدة الجلسة + فاصل) إلى قائمة بدايات المواعيد
const MAX_NEW_SLOTS = 300;
function slotPlan(){
  const date = $('slDate').value, from = $('slTime').value, to = $('slTimeTo').value;
  const dur = parseInt($('slDur').value), gap = parseInt($('slGap').value) || 0;
  if (!date || !from || !to) return { starts: [], offsets: [], incomplete: true };
  const [y, mo, d] = date.split('-').map(Number), [h, mi] = from.split(':').map(Number), [h2, mi2] = to.split(':').map(Number);
  const startMin = h * 60 + mi; let endMin = h2 * 60 + mi2;
  if (endMin === 0) endMin = 1440; // «إلى 12:00 منتصف الليل»
  if (endMin <= startMin) return { starts: [], offsets: [], err: t('وقت النهاية لازم يكون بعد وقت البداية.', 'The end time must be after the start time.') };
  if (endMin - startMin < dur) return { starts: [], offsets: [], err: t('الفترة أقصر من مدة الجلسة الواحدة.', 'The range is shorter than a single session.') };
  const offsets = [];
  for (let m = startMin; m + dur <= endMin; m += dur + gap) offsets.push(m);
  const weekly = document.querySelector('input[name=slotMode]:checked').value === 'weekly';
  const days = [];
  if (!weekly) days.push(new Date(y, mo - 1, d));
  else {
    const wds = [...document.querySelectorAll('.wd:checked')].map(i => +i.value);
    const weeks = Math.min(12, Math.max(1, parseInt($('slWeeks').value) || 1));
    if (!wds.length) return { starts: [], offsets, err: t('اختر يوماً واحداً على الأقل.', 'Pick at least one day.') };
    for (let i = 0; i < weeks * 7; i++) { const dt = new Date(y, mo - 1, d + i); if (wds.includes(dt.getDay())) days.push(dt); }
  }
  const starts = [];
  days.forEach(dt => offsets.forEach(m => starts.push(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate(), 0, m))));
  return { starts, offsets, days: days.length };
}
function updateSlotPreview(){
  const box = $('slPreview'); if (!box) return;
  const p = slotPlan();
  if (p.incomplete) { box.textContent = ''; return; }
  if (p.err) { box.className = 'muted'; box.style.color = 'var(--alert)'; box.textContent = p.err; return; }
  box.style.color = '';
  const fresh = p.starts.filter(dt => dt > now());
  const times = p.offsets.map(m => fmtT(new Date(2000, 0, 1, 0, m)));
  const per = t('في اليوم الواحد ' + p.offsets.length + ' موعد: ', p.offsets.length + ' slot(s) per day: ');
  const total = p.days > 1 ? t(' — المجموع ' + fresh.length + ' موعد.', ' — ' + fresh.length + ' in total.') : '';
  const over = fresh.length > MAX_NEW_SLOTS ? t(' (سيُضاف أول ' + MAX_NEW_SLOTS + ' فقط)', ' (only the first ' + MAX_NEW_SLOTS + ' will be added)') : '';
  box.textContent = per + times.join(' · ') + total + over;
}
async function addSlots(){
  const msg = $('slMsg'); msg.className = 'msg'; msg.textContent = '';
  const dur = parseInt($('slDur').value);
  const plan = slotPlan();
  if (plan.incomplete) { msg.className = 'msg err'; msg.textContent = t('اختر التاريخ ووقت البداية والنهاية.', 'Pick a date, a start time and an end time.'); return; }
  if (plan.err) { msg.className = 'msg err'; msg.textContent = plan.err; return; }
  const starts = plan.starts;
  const existing = new Set(SLOTS.map(s => new Date(s.starts_at).getTime()));
  const rows = starts.filter(dt => dt > now() && !existing.has(dt.getTime())).slice(0, MAX_NEW_SLOTS)
    .map(dt => ({ specialist_id: ME.id, starts_at: dt.toISOString(), duration_min: dur }));
  if (!rows.length) { msg.className = 'msg err'; msg.textContent = t('لا مواعيد جديدة لإضافتها (إما في الماضي أو مضافة مسبقاً).', 'No new slots to add (they are in the past or already added).'); return; }
  $('slAdd').disabled = true;
  const { error } = await sb.from('availability_slots').insert(rows);
  $('slAdd').disabled = false;
  if (error) { console.error(error); msg.className = 'msg err'; msg.textContent = t('تعذّرت الإضافة. ربما أحد المواعيد مضاف مسبقاً.', 'Could not add. One of the slots may already exist.'); return; }
  await loadAll(); renderSchedule();
  $('slMsg').className = 'msg ok'; $('slMsg').textContent = t('تمت إضافة ' + rows.length + ' موعد.', rows.length + ' slot(s) added.');
}

/* ---------- client files ---------- */
function buildClients(){
  const map = {};
  BOOKINGS.filter(b => b.paid).forEach(b => { const e = b.email.toLowerCase(); (map[e] = map[e] || { email: e, name: b.full_name, phone: b.phone, sessions: [] }).sessions.push(b); });
  return Object.values(map).map(c => {
    c.sessions.sort((a, b) => new Date(b.preferred_datetime) - new Date(a.preferred_datetime));
    c.done = c.sessions.filter(b => !isCancelled(b) && new Date(b.preferred_datetime) <= now()).length;
    c.next = c.sessions.filter(b => !isCancelled(b) && new Date(b.preferred_datetime) > now()).sort((a, b) => new Date(a.preferred_datetime) - new Date(b.preferred_datetime))[0];
    c.last = c.sessions.find(b => !isCancelled(b) && new Date(b.preferred_datetime) <= now());
    return c;
  }).sort((a, b) => new Date((b.next || b.last || b.sessions[0]).preferred_datetime) - new Date((a.next || a.last || a.sessions[0]).preferred_datetime));
}

        <div class="field"><label for="pwNew">${t('كلمة سر جديدة', 'New password')}</label><input type="password" id="pwNew" minlength="8" autocomplete="new-password" class="ltr"></div>
        <div class="field"><label for="pwNew2">${t('تأكيد كلمة السر', 'Confirm password')}</label><input type="password" id="pwNew2" minlength="8" autocomplete="new-password" class="ltr"></div>
      </div>
      <p class="muted" style="margin-bottom:12px;">${t('٨ أحرف على الأقل، وتضم حرفاً ورقماً.', 'At least 8 characters, with a letter and a number.')}</p>
      <button class="btn2" type="submit">${t('تغيير كلمة السر', 'Change password')}</button><div class="msg" id="pwMsg"></div>
    </form>`;
  const setPhoto = (u) => { pfPhoto = u || ''; $('pfImg').src = pfPhoto || PLACEHOLDER; };
  $('pfRemove').addEventListener('click', () => { setPhoto(''); $('pfMsg').className = 'msg'; $('pfMsg').textContent = t('ستُحذف الصورة عند الحفظ.', 'The photo will be removed when you save.'); });
  $('pfFile').addEventListener('change', async () => {
    const file = $('pfFile').files[0]; if (!file) return;
    $('pfMsg').className = 'msg'; $('pfMsg').textContent = t('جارٍ رفع الصورة...', 'Uploading photo...');
    try {
      const blob = await resizeJpeg(file);
      const path = PH_SELF + ME.id + '/' + Date.now() + '.jpg';
      const { error } = await sb.storage.from('specialist-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (error) throw error;
      const { data: pub } = sb.storage.from('specialist-photos').getPublicUrl(path);
      pfUploaded.push(pub.publicUrl); setPhoto(pub.publicUrl);
      $('pfMsg').textContent = t('تم رفع الصورة. اضغط «حفظ التغييرات» لتثبيتها.', 'Photo uploaded. Press “Save changes” to apply it.');
    } catch (err) { console.error(err); $('pfMsg').className = 'msg err'; $('pfMsg').textContent = t('تعذّر رفع الصورة.', 'Could not upload the photo.'); }
    finally { $('pfFile').value = ''; }
  });
  $('pfForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const msg = $('pfMsg'); msg.className = 'msg'; msg.textContent = '';
    const yrs = $('pfYears').value === '' ? null : Math.min(60, Math.max(0, parseInt($('pfYears').value) || 0));
    const payload = { full_name: $('pfName').value.trim(), years_experience: yrs, specialty: $('pfSpecialty').value.trim(), short_bio: $('pfShort').value.trim() || null, bio: $('pfBio').value.trim(), full_name_en: $('pfNameEn').value.trim() || null, specialty_en: $('pfSpecialtyEn').value.trim() || null, short_bio_en: $('pfShortEn').value.trim() || null, bio_en: $('pfBioEn').value.trim() || null, photo_url: pfPhoto };
    const { error } = await sb.from('specialists').update(payload).eq('id', ME.id);
    if (error) { console.error(error); msg.className = 'msg err'; msg.textContent = t('تعذّر الحفظ.', 'Could not save.'); return; }
    // نحذف من التخزين صورنا القديمة فقط (المسار self/<id>/...)، وأي صورة رُفعت ولم تُستخدم
    const stale = [pfOriginal, ...pfUploaded].filter(u => u && u !== pfPhoto).map(photoPath).filter(x => x && x.startsWith(PH_SELF + ME.id + '/'));
    if (stale.length) await sb.storage.from('specialist-photos').remove(stale);
    pfOriginal = pfPhoto; pfUploaded = [];
    PROFILE = { ...PROFILE, ...payload }; ME.full_name = payload.full_name; setHello();
    msg.className = 'msg ok'; msg.textContent = t('تم الحفظ. التغييرات ظاهرة الآن في صفحتك.', 'Saved. Your changes are now live on your page.');
  });
  $('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const msg = $('pwMsg'); msg.className = 'msg'; msg.textContent = '';
    const a = $('pwNew').value, b = $('pwNew2').value;
    if (a.length < 8 || !/[A-Za-z؀-ۿ]/.test(a) || !/\d/.test(a)) { msg.className = 'msg err'; msg.textContent = t('كلمة السر لازم تكون ٨ أحرف على الأقل وتضم حرفاً ورقماً.', 'The password must be at least 8 characters with a letter and a number.'); return; }
    if (a !== b) { msg.className = 'msg err'; msg.textContent = t('كلمتا السر غير متطابقتين.', 'The two passwords do not match.'); return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { console.error(error); msg.className = 'msg err'; msg.textContent = t('تعذّر تغيير كلمة السر.', 'Could not change the password.'); return; }
    $('pwNew').value = ''; $('pwNew2').value = '';
    msg.className = 'msg ok'; msg.textContent = t('تم تغيير كلمة السر.', 'Password changed.');
  });
}
function resizeJpeg(file, maxDim = 900, q = 0.86){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxDim / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad image')); }; img.src = u;
  });
}

/* ---------- delegated clicks ---------- */
document.addEventListener('click', async (e) => {
  const f = e.target.closest('[data-file]'); if (f) { openClient(f.dataset.file); return; }
  const del = e.target.closest('[data-del-slot]');
  if (del) {
    if (!confirm(t('حذف هذا الموعد؟', 'Delete this slot?'))) return;
    const { error } = await sb.from('availability_slots').delete().eq('id', del.dataset.delSlot);
    if (error) { alert(t('تعذّر الحذف. ربما حُجز الموعد للتو.', 'Could not delete. The slot may have just been booked.')); }
    await loadAll(); renderSchedule(); return;
  }
  const dn = e.target.closest('[data-del-note]');
  if (dn) { if (!confirm(t('حذف هذه الملاحظة نهائياً؟', 'Delete this note permanently?'))) return; const { error } = await sb.from('client_notes').delete().eq('id', dn.dataset.delNote); if (error) alert(t('تعذّر الحذف.', 'Could not delete.')); openClient(currentClient); return; }
  const en = e.target.closest('[data-edit-note]');
  if (en) {
    const box = document.querySelector('[data-note="' + CSS.escape(en.dataset.editNote) + '"] .nbody'), old = box.textContent;
    box.innerHTML = `<textarea class="inp" style="min-height:90px;" maxlength="10000">${esc(old)}</textarea><div class="row" style="margin-top:8px;"><button class="btn2" data-save-note="${esc(en.dataset.editNote)}">${t('حفظ', 'Save')}</button><button class="btn2" data-cancel-note>${t('إلغاء', 'Cancel')}</button></div>`;
    return;
  }
  const sn = e.target.closest('[data-save-note]');
  if (sn) { const body = sn.closest('.nbody').querySelector('textarea').value.trim(); if (!body) return; const { error } = await sb.from('client_notes').update({ body }).eq('id', sn.dataset.saveNote); if (error) alert(t('تعذّر الحفظ.', 'Could not save.')); openClient(currentClient); return; }
  if (e.target.closest('[data-cancel-note]')) openClient(currentClient);
});
document.addEventListener('change', async (e) => {
  const o = e.target.closest('[data-outcome]'); if (!o) return;
  const { error } = await sb.rpc('set_session_outcome', { p_booking: o.dataset.outcome, p_outcome: o.value || null });
  if (error) { console.error(error); alert(t('تعذّر حفظ النتيجة.', 'Could not save the outcome.')); return; }
  const b = BOOKINGS.find(x => x.id === o.dataset.outcome); if (b) b.outcome = o.value || null;
});

start();
</script>
