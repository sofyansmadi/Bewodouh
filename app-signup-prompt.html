<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>احفظي رحلتك — بوضوح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241D2E; --ink-soft:#372C46;
    --fog:#F3EEEA; --fog-dim:#E6DFDA;
    --clarity:#C9A15F; --clarity-soft:#E4C98A;
    --text-muted-light:#6B6072; --text-on-light:#2A2130;
    --text-muted-dark:#B7ACC4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html, body{ height:100%; }
  body{
    background:radial-gradient(140% 100% at 50% 0%, var(--ink-soft) 0%, var(--ink) 65%, #1A1522 100%);
    font-family:'IBM Plex Sans Arabic', sans-serif; color:var(--text-muted-dark);
    display:flex; flex-direction:column; min-height:100vh; padding:0 26px;
  }
  main{ flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; animation:fadeIn .5s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .icon-badge{ width:72px; height:72px; border-radius:50%; background:rgba(201,161,95,.15); display:flex; align-items:center; justify-content:center; margin:0 auto 26px; }
  .icon-badge svg{ width:32px; height:32px; color:var(--clarity-soft); }

  h1{ font-family:'Noto Kufi Arabic',sans-serif; font-size:24px; font-weight:900; color:#F3EEEA; max-width:16ch; margin:0 auto 14px; line-height:1.5; }
  p{ font-size:14.5px; max-width:34ch; margin:0 auto; line-height:1.9; }

  .benefits{ display:flex; flex-direction:column; gap:14px; margin:34px auto 0; text-align:right; max-width:300px; }
  .benefit{ display:flex; align-items:center; gap:12px; font-size:13.5px; color:#EDE7E3; }
  .benefit svg{ width:16px; height:16px; color:var(--clarity); flex-shrink:0; }

  .btn-primary{
    background:var(--clarity); color:var(--ink); font-weight:700; font-size:15px; padding:16px; border-radius:100px;
    border:none; cursor:pointer; font-family:inherit; width:100%; margin-top:36px; text-decoration:none; display:block;
  }
  .btn-primary:hover{ background:var(--clarity-soft); }
  .skip-btn{
    background:none; border:none; color:var(--text-muted-dark); font-size:13.5px; padding:16px; cursor:pointer;
    font-family:inherit; width:100%; text-decoration:underline;
  }
  footer{ padding:12px 0 30px; }
</style>
</head>
<body>

<main>
  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
  </div>
  <h1>سجّلي لتحفظي رحلتك</h1>
  <p>حساب بسيط بيخليك تكمّلي من وين وقفتي، وتحتفظي بنتائج اختباراتك.</p>

  <div class="benefits">
    <div class="benefit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> نتائج اختباراتك تتحفظ عندك</div>
    <div class="benefit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> متابعة حجوزاتك واستشاراتك</div>
    <div class="benefit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> محتوى مخصص حسب اهتمامك</div>
  </div>
</main>

<a href="/signup/" class="btn-primary">أنشئ حسابك الآن</a>
<button class="skip-btn" id="skipBtn">تخطي الآن، كمّلي كضيف</button>

<footer></footer>

<script>
document.getElementById('skipBtn').addEventListener('click', () => {
  window.location.href = 'index.html';
});
</script>

</body>
</html>
